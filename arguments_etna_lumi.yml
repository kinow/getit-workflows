# Volcano label
volcano: 'Etna'

# Type of scenario (high, medium, low)
scenario: 'high'

# Meteorological dataset
meteo_database: 'ERA5ML'

# Type of initial condition (NONE,INSERTION,RESTART)
initial_condition: 'RESTART'

# Time range
start_date_time: "2018-12-25T00:00:00Z"
end_date_time:   "2018-12-26T00:00:00Z"

# Grid definition
wkt: "POLYGON((8.0 33.0, 22.0 33.0, 22.0 40.0, 8.0 40.0, 8.0 33.0))" # wkt1: OK, AOI over the AOI and Etna
# wkt: "POLYGON((8.607397 38.616513, 10.101233 38.616513, 10.101233 39.605336, 8.607397 39.605336, 8.607397 38.616513))" # wkt2: WRONG: inside AOI but not over Etna
# wkt: "POLYGON((-5.3228 32.916101, -9.848244 30.901832, -6.728763 29.802121, -1.983638 29.151762, 0.388924 31.165418, -5.3228 32.916101))" # wkt3: WRONG: outside AOI

dx: 0.05
dy: 0.05
nlevels: 24

# Volcano coordinates
vent_lon: 15.0
vent_lat: 37.75
vent_height: 3300

# MPI tasks
#nx_mpi: 3
#ny_mpi: 2
#nz_mpi: 1

# Plot configuration
keys:
  - tephra_col_mass
  # - tephra_cloud_top
  # - SO2_col_mass
  - SO2_cloud_top

# Time frequency
times: 6

# Path to FALL3D executable and input data.
# Set the scratch or project directory here.
# export SCRATCH_DIR=/project/project_1234/user/
# sed -i "s|HPC_SCRATCH_DIR|$SCRATCH_DIR|g" arguments_etna_lumi.yml
template: HPC_SCRATCH_DIR/getit-workflows/app_etna/template.inp
meteo: HPC_SCRATCH_DIR/getit-workflows/app_etna/meteo.nc
restart: HPC_SCRATCH_DIR/getit-workflows/app_etna/restart.nc
dictionary: HPC_SCRATCH_DIR/getit-workflows/app_etna/ERA5.tbl
levels: HPC_SCRATCH_DIR/getit-workflows/app_etna/L137_ECMWF.levels
exe: HPC_SCRATCH_DIR/fall3d/build/bin/Fall3d.Cray.r8.mpi.cpu.x
