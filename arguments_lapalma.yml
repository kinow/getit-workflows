# Type of scenario (high, medium, low)
scenario: 'low'

# Meteorological dataset
meteo_database: 'ERA5'

# Type of initial condition (NONE,INSERTION,RESTART)
initial_condition: 'RESTART'

# Time range
start_date_time: "2021-09-25T06:00:00Z"
end_date_time:   "2021-09-26T06:00:00Z"

# Grid definition
wkt: "POLYGON((-24.0 23.0, 10.0 23.0, 10.0 50.0, -24.0 50.0, -24.0 23.0))"
dx: 0.1
dy: 0.1
nlevels: 20

# Volcano coordinates
vent_lon: -17.86647
vent_lat:  28.61339
vent_height: 1130

# MPI tasks
#nx_mpi: 3
#ny_mpi: 2
#nz_mpi: 1

# Plot configuration
keys:
  - tephra_col_mass
  - tephra_cloud_top
  - SO2_col_mass
  - SO2_cloud_top

# Time frequency
times: 6
